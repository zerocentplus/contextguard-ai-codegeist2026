modules:
  jira:issuePanel:
    - key: contextguard-jira-panel
      resource: main
      resolver:
        function: resolver
      title: ContextGuard AI
      icon: https://atlassian.com
  confluence:contentBylineItem:
    - key: contextguard-confluence-byline
      resource: main
      resolver:
        function: resolver
      title: ContextGuard AI
      icon: https://atlassian.com
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/main
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.summary
    - read:confluence-content.all
    - storage:app
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/a183c8c1-c669-4d0f-9378-55c83ae29e98
